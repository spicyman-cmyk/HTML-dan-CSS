<!DOCTYPE html>
<html lang="id">
    <head>
        <title>Tabel</title>
    </head>

    <body> 
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th rowspan="2">Kategori</th>
                    <th colspan="2">Rincian Produk</th>
                </tr>
                <tr>
                    <th>Nama Item</th>
                    <th>Spesifikasi</th>
                </tr>
            </thead>
            <thead>
                <tbody>
                    <tr>
                        <td rowspan="2">Perangkat keras</td>
                        <td>Monitor LED</td>
                        <td>24 inch, Full HD</td>
                    </tr>
                    <tr>
                        <td>Keyboard Mekanik</td>
                        <td>
                            <ul>
                                <li>Switch Biru</li>
                                <li>Backlit RGB</li>
                            </ul>
                        </td>
                    </tr>
                </tbody>
            </thead>
        </table>
    </body>
